version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ehs_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ehs_safety
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: ehs_backend
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql+pg8000://admin:admin123@postgres:5432/ehs_safety
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  web-dashboard:
    build:
      context: ../web-dashboard
      dockerfile: ../docker/Dockerfile.frontend
    container_name: ehs_web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
